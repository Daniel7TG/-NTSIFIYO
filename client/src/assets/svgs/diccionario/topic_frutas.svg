<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <!-- Gradiente de la fruta (Manzana) -->
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <!-- Gradiente de la hoja -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Fruta secundaria de fondo (Cereza/Uva) -->
  <circle cx="46" cy="42" r="6" fill="#F43F5E" opacity="0.3" />
  <path d="M 46,36 C 46,30 42,32 38,30" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- Manzana principal flotante -->
  <g transform="translate(28, 34)" filter="drop-shadow(0px 3px 2px rgba(159, 18, 57, 0.2))">
    <!-- Manzana -->
    <path d="M 0,-10 C -12,-10 -15,0 -12,10 C -9,20 9,20 12,10 C 15,0 12,-10 0,-10 Z" fill="url(#fruitGrad)" />
    <!-- Hendidura superior -->
    <path d="M -3,-10 C 0,-7 0,-7 3,-10" fill="none" stroke="#9F1239" stroke-width="2" stroke-linecap="round" />
    
    <!-- Tallo -->
    <path d="M 0,-9 C 0,-16 4,-18 7,-18" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
    
    <!-- Hoja verde -->
    <path d="M 6,-18 C 11,-18 15,-15 14,-11 C 13,-7 7,-10 6,-18 Z" fill="url(#leafGrad)" />
    
    <!-- Brillo en la manzana -->
    <path d="M -8,-2 C -10,4 -6,8 -6,8" fill="none" stroke="#FFE4E6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
