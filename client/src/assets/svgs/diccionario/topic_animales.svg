<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo cálido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <!-- Gradiente del animal (Zorro/Perro estilizado) -->
    <linearGradient id="animalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Huella de patita flotando decorativa -->
  <g fill="#FDBA74" opacity="0.5">
    <circle cx="48" cy="18" r="3" />
    <circle cx="53" cy="22" r="2.5" />
    <circle cx="43" cy="22" r="2.5" />
    <path d="M 48,22 C 45,22 44,25 45,27 C 46,29 50,29 51,27 C 52,25 51,22 48,22 Z" />
  </g>

  <!-- Silueta geométrica moderna del Zorro/Perro -->
  <g transform="translate(32, 34)" filter="drop-shadow(0px 3px 2px rgba(194, 65, 12, 0.2))">
    <!-- Cabeza y orejas integradas -->
    <path d="M -16,-2 L -18,-16 L -6,-10 L 0,-14 L 6,-10 L 18,-16 L 16,-2 L 10,8 L -10,8 Z" fill="url(#animalGrad)" />
    
    <!-- Detalles internos de las orejas (blancos/crema) -->
    <path d="M -15,-3 L -16.5,-12.5 L -8.5,-8 Z" fill="#FFF7ED" opacity="0.9" />
    <path d="M 15,-3 L 16.5,-12.5 L 8.5,-8 Z" fill="#FFF7ED" opacity="0.9" />
    
    <!-- Mejillas blancas (Mazahua style) -->
    <path d="M -16,-2 C -10,2 -6,3 -6,8 L -10,8 Z" fill="#FFF7ED" opacity="0.9" />
    <path d="M 16,-2 C 10,2 6,3 6,8 L 10,8 Z" fill="#FFF7ED" opacity="0.9" />

    <!-- Nariz negra -->
    <polygon points="-3,8 3,8 0,11" fill="#1E293B" />
    
    <!-- Ojos cerrados (estilo tierno/moderno) -->
    <path d="M -9,-2 C -8,0 -6,0 -5,-2" fill="none" stroke="#FFF7ED" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 9,-2 C 8,0 6,0 5,-2" fill="none" stroke="#FFF7ED" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
