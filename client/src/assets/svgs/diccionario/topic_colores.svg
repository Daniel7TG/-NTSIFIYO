<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <!-- Gradiente de la paleta -->
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <!-- Gradiente de madera del pincel -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Paleta artística con pincel -->
  <g transform="translate(30, 32)" filter="drop-shadow(0px 3px 2px rgba(107, 33, 168, 0.15))">
    <!-- Paleta de pintor -->
    <path d="M-18,-15 C-8,-22 14,-15 18,-6 C22,4 12,20 -2,18 C-10,17 -11,10 -15,10 C-19,10 -24,-4 -18,-15 Z" fill="url(#paletteGrad)" stroke="#CBD5E1" stroke-width="1" />
    <!-- Orificio de agarre de la paleta -->
    <circle cx="-10" cy="-6" r="3" fill="#E9D5FF" />

    <!-- Colores en la paleta -->
    <circle cx="-10" cy="5" r="3.5" fill="#EF4444" /> <!-- Rojo -->
    <circle cx="-2" cy="11" r="3.5" fill="#3B82F6" /> <!-- Azul -->
    <circle cx="8" cy="9" r="3" fill="#10B981" /> <!-- Verde -->
    <circle cx="12" cy="0" r="3.5" fill="#F59E0B" /> <!-- Naranja -->
    <circle cx="6" cy="-8" r="3.2" fill="#EC4899" /> <!-- Rosa -->

    <!-- Pincel atravesado -->
    <g transform="translate(5, 0) rotate(45)">
      <!-- Mango de madera -->
      <rect x="-1" y="-24" width="2" height="34" fill="url(#woodGrad)" rx="0.5" />
      <!-- Casquillo plateado -->
      <rect x="-1.5" y="10" width="3" height="4" fill="#94A3B8" />
      <!-- Cerdas con pintura morada -->
      <path d="M -1.5,14 L 1.5,14 C 2,16 2,18 0,21 C -2,18 -2,16 -1.5,14 Z" fill="#8B5CF6" />
    </g>
  </g>
</svg>
