<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <!-- Gradientes de las personas (Pronombres) -->
    <linearGradient id="peopleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="peopleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Grupo de personas (Pronombres: Yo, Tú, Nosotros) -->
  <g transform="translate(32, 34)" filter="drop-shadow(0px 3px 2px rgba(51, 65, 85, 0.2))">
    
    <!-- Persona 1 (Izquierda, fondo) -->
    <g transform="translate(-10, 4) scale(0.85)">
      <circle cx="0" cy="-10" r="6" fill="url(#peopleGrad2)" />
      <path d="M -10,2 C -10,-4 -6,-5 0,-5 C 6,-5 10,-4 10,2 L 10,12 L -10,12 Z" fill="url(#peopleGrad2)" />
    </g>

    <!-- Persona 2 (Derecha, fondo) -->
    <g transform="translate(10, 4) scale(0.85)">
      <circle cx="0" cy="-10" r="6" fill="url(#peopleGrad2)" />
      <path d="M -10,2 C -10,-4 -6,-5 0,-5 C 6,-5 10,-4 10,2 L 10,12 L -10,12 Z" fill="url(#peopleGrad2)" />
    </g>

    <!-- Persona 3 (Centro, frente y más grande - "YO") -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="-12" r="7" fill="url(#peopleGrad1)" stroke="#F8FAFC" stroke-width="1.5" />
      <path d="M -11,2 C -11,-4 -6,-6 0,-6 C 6,-6 11,-4 11,2 L 11,14 L -11,14 Z" fill="url(#peopleGrad1)" stroke="#F8FAFC" stroke-width="1.5" />
      <!-- Detalle de corbata/cuello en el centro -->
      <path d="M -2,-6 L 0,-2 L 2,-6" fill="none" stroke="#F8FAFC" stroke-width="1" />
    </g>
  </g>
</svg>
