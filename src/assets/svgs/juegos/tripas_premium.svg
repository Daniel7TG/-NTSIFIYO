<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave premium -->
    <filter id="shadow-premium" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    
    <!-- Filtro de resplandor para nodos activos -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes lineales para las líneas ("tripas") -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Silueta de Gato de fondo sutil pero elegante -->
  <g transform="translate(60, 62) scale(0.9)" opacity="0.15" filter="url(#shadow-premium)">
    <!-- Orejas -->
    <path d="M-30,-15 L-38,-45 L-10,-28 Z" fill="#475569" />
    <path d="M30,-15 L38,-45 L10,-28 Z" fill="#475569" />
    <!-- Cabeza -->
    <circle cx="0" cy="0" r="32" fill="#475569" />
    <!-- Bigotes -->
    <path d="M-25,5 L-45,2 M-25,10 L-48,10 M-25,15 L-44,18" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <path d="M25,5 L45,2 M25,10 L48,10 M25,15 L44,18" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Grupo principal con sombra -->
  <g filter="url(#shadow-premium)">
    <!-- Línea 1 (Azul/Cyan) - Curvada y serpenteante sin cruzarse -->
    <path d="M 25,25 C 10,60 110,30 95,95" fill="none" stroke="url(#lineGrad1)" stroke-width="6" stroke-linecap="round" />
    <!-- Línea 1 interna discontinua para efecto Premium/Camino -->
    <path d="M 25,25 C 10,60 110,30 95,95" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.8" />

    <!-- Línea 2 (Rosa/Morado) - Curvada alrededor de la otra sin cruzarse -->
    <path d="M 95,25 C 70,55 30,65 25,95" fill="none" stroke="url(#lineGrad2)" stroke-width="6" stroke-linecap="round" />
    <path d="M 95,25 C 70,55 30,65 25,95" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.8" />

    <!-- Nodos de conexión (A-A y B-B) -->
    
    <!-- Nodo Superior Izquierdo (A1) -->
    <circle cx="25" cy="25" r="11" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="3" />
    <circle cx="25" cy="25" r="6" fill="#0EA5E9" filter="url(#glow-cyan)" />
    <text x="25" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- Nodo Superior Derecho (B1) -->
    <circle cx="95" cy="25" r="11" fill="#FFFFFF" stroke="#EC4899" stroke-width="3" />
    <circle cx="95" cy="25" r="6" fill="#EC4899" />
    <text x="95" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>

    <!-- Nodo Inferior Izquierdo (B2) -->
    <circle cx="25" cy="95" r="11" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="25" cy="95" r="6" fill="#8B5CF6" />
    <text x="25" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>

    <!-- Nodo Inferior Derecho (A2) -->
    <circle cx="95" cy="95" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" />
    <circle cx="95" cy="95" r="6" fill="#2563EB" filter="url(#glow-cyan)" />
    <text x="95" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- Detalle decorativo: Puntero de mano dibujando -->
  <g transform="translate(60, 52) rotate(-15)" filter="url(#shadow-premium)">
    <!-- Trazo de chispa o brillo de dibujo -->
    <path d="M-8,-8 L-4,-4 M8,-8 L4,-4 M0,-10 L0,-6" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
