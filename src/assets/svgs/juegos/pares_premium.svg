<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Sombra 3D realista para dar altura a las tarjetas -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>

    <!-- Resplandor mágico de conexión -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes de color -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Enlace mágico de neón que conecta la imagen con la palabra -->
  <g>
    <!-- Resplandor de fondo de la línea -->
    <path d="M 38,50 C 70,30 50,90 82,70" fill="none" stroke="#A7F3D0" stroke-width="7" stroke-linecap="round" opacity="0.4" filter="url(#neon-glow)" />
    <!-- Línea principal con degradado verde -->
    <path d="M 38,50 C 70,30 50,90 82,70" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Detalle dinámico interno de la línea -->
    <path d="M 38,50 C 70,30 50,90 82,70" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" />
  </g>

  <!-- TARJETA IZQUIERDA: La Imagen (Sol brillante) -->
  <g transform="translate(15, 20) rotate(-6)" filter="url(#card-shadow)">
    <!-- Base de la tarjeta -->
    <rect x="0" y="0" width="36" height="52" rx="10" fill="url(#cardBg)" stroke="#10B981" stroke-width="2" />
    <!-- Borde interior decorativo -->
    <rect x="3" y="3" width="30" height="46" rx="7" fill="none" stroke="#34D399" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Ilustración del Sol (Imagen) -->
    <g transform="translate(18, 26)">
      <!-- Rayos del sol -->
      <path d="M0,-12 L0,-8 M0,8 L0,12 M-12,0 L-8,0 M8,0 L12,0 M-8,-8 L-5,-5 M5,5 L8,8 M-8,8 L-5,5 M5,-5 L8,-8" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
      <!-- Núcleo del sol con gradiente -->
      <circle cx="0" cy="0" r="6" fill="url(#sunGrad)" stroke="#EA580C" stroke-width="1" />
    </g>
    
    <!-- Indicador de tipo: Icono de foto pequeñito arriba -->
    <rect x="5" y="6" width="6" height="5" rx="1" fill="#94A3B8" opacity="0.5" />
    <circle cx="9" cy="8" r="1" fill="#FFFFFF" />
  </g>

  <!-- TARJETA DERECHA: La Palabra ("Hyadi" - Sol en Mazahua) -->
  <g transform="translate(68, 42) rotate(6)" filter="url(#card-shadow)">
    <!-- Base de la tarjeta -->
    <rect x="0" y="0" width="36" height="52" rx="10" fill="url(#cardBg)" stroke="#059669" stroke-width="2.5" />
    <!-- Borde interior decorativo -->
    <rect x="3" y="3" width="30" height="46" rx="7" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Texto de la palabra: "Hyadi" -->
    <!-- Caja simulada de texto manuscrita/etiqueta -->
    <rect x="5" y="20" width="26" height="15" rx="3" fill="#E6F4EA" stroke="#A7F3D0" stroke-width="1" />
    
    <!-- Palabra real "Hyadi" en fuente legible y gruesa -->
    <text x="18" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#047857" text-anchor="middle">Hyadi</text>
    
    <!-- Indicador de tipo: Icono de micrófono/texto pequeñito arriba -->
    <rect x="25" y="6" width="6" height="4" rx="1" fill="#94A3B8" opacity="0.5" />
    <line x1="27" y1="8" x2="29" y2="8" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Chispas / Estrellas decorativas de emparejamiento exitoso -->
  <g opacity="0.8" filter="url(#neon-glow)">
    <path d="M 52,22 L 54,25 L 58,26 L 54,27 L 52,30 L 50,27 L 46,26 L 50,25 Z" fill="#FBBF24" />
    <path d="M 68,90 L 69,92 L 72,93 L 69,94 L 68,97 L 67,94 L 64,93 L 67,92 Z" fill="#34D399" />
  </g>
</svg>
