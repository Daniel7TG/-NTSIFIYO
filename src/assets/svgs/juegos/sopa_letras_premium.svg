<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para elementos del tablero -->
    <filter id="shadow-board" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>
    <!-- Sombra para la lupa -->
    <filter id="shadow-lens" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <!-- Gradiente de fondo del tablero -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <!-- Gradiente para el resaltado del texto -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
    <!-- Gradiente metálico para la lupa -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <!-- Gradiente dorado para el mango de la lupa -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Fondo del tablero redondeado -->
  <rect x="10" y="10" width="100" height="100" rx="16" fill="url(#bgGrad)" filter="url(#shadow-board)" />

  <!-- Cuadrícula decorativa sutil -->
  <g opacity="0.15">
    <line x1="33" y1="14" x2="33" y2="106" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="56" y1="14" x2="56" y2="106" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="79" y1="14" x2="79" y2="106" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="14" y1="33" x2="106" y2="33" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="14" y1="56" x2="106" y2="56" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="14" y1="79" x2="106" y2="79" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Selección/Resaltado de la palabra "MAZAHUA" (simulada aquí con "MAZ") -->
  <!-- Una píldora redondeada translúcida brillante -->
  <rect x="17" y="17" width="86" height="26" rx="13" fill="url(#highlightGrad)" stroke="#38BDF8" stroke-width="2" />

  <!-- Letras de la Sopa de Letras (Ejemplo con Easter Eggs) -->
  <!-- Fila 1: M A Z A (Resaltada) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    <text x="28" y="35">M</text>
    <text x="51" y="35">A</text>
    <text x="74" y="35">Z</text>
    <text x="94" y="35" fill="#E0F2FE">A</text>
  </g>

  <!-- Fila 2: J A T R (Spells J-ATR) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" opacity="0.8" text-anchor="middle">
    <text x="28" y="56">J</text>
    <text x="51" y="56">A</text>
    <text x="74" y="56">T</text>
    <text x="94" y="56">R</text>
  </g>

  <!-- Fila 3: J O K L (Spells JO) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" opacity="0.8" text-anchor="middle">
    <text x="28" y="78">J</text>
    <text x="51" y="78">O</text>
    <text x="74" y="78">K</text>
    <text x="94" y="78">L</text>
  </g>

  <!-- Fila 4: X H U B -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" opacity="0.8" text-anchor="middle">
    <text x="28" y="99">X</text>
    <text x="51" y="99">H</text>
    <text x="74" y="99">U</text>
    <text x="94" y="99">B</text>
  </g>

  <!-- Lupa Superpuesta buscando/ampliando la letra 'Z' -->
  <g transform="translate(74, 30)" filter="url(#shadow-lens)">
    <!-- Mango de la lupa -->
    <path d="M 12,12 L 28,28" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 12,12 L 28,28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <!-- Borde metálico de la lupa -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
    <!-- Lente de cristal con reflejo azul/celeste -->
    <circle cx="0" cy="0" r="14" fill="#38BDF8" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1" />
    <!-- Brillo/reflejo curvo del cristal -->
    <path d="M -9,-6 A 11 11 0 0 1 6,-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
