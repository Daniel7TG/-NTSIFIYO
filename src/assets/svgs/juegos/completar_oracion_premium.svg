<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Sombra 3D premium -->
    <filter id="shadow-3d" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="4.5" flood-color="#0369A1" flood-opacity="0.22"/>
    </filter>

    <!-- Resplandor de selección del campo vacío -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Brillos de fondo mágicos -->
  <circle cx="60" cy="55" r="30" fill="#E0F2FE" filter="blur(15px)" opacity="0.6" />

  <!-- TARJETA PRINCIPAL (La Oración / Hoja de Ejercicio) -->
  <g transform="translate(18, 20) rotate(-4)" filter="url(#shadow-3d)">
    <!-- Base de la hoja del ejercicio -->
    <rect x="0" y="0" width="84" height="66" rx="10" fill="url(#cardBg)" stroke="#0284C7" stroke-width="2" />
    <!-- Borde interior decorativo -->
    <rect x="3" y="3" width="78" height="60" rx="7" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.3" />
    
    <!-- Líneas de texto simulando la oración -->
    <g transform="translate(8, 12)">
      <!-- Renglon 1 -->
      <line x1="2" y1="5" x2="30" y2="5" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="34" y1="5" x2="52" y2="5" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      
      <!-- Renglon 2: Contiene el Espacio en Blanco a completar -->
      <line x1="2" y1="18" x2="14" y2="18" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      
      <!-- Espacio vacío (Caja de entrada o selección punteada) -->
      <rect x="18" y="11" width="32" height="13" rx="3.5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#glow-cyan)"/>
      <!-- Palabra colocada dentro de la caja ("neje") -->
      <text x="34" y="20.5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#0369A1" text-anchor="middle">neje</text>
      
      <line x1="54" y1="18" x2="66" y2="18" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Renglon 3 -->
      <line x1="2" y1="31" x2="22" y2="31" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="26" y1="31" x2="48" y2="31" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="52" y1="31" x2="64" y2="31" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Marca de verificación verde discreta en la esquina para indicar éxito -->
    <g transform="translate(74, 52)">
      <circle cx="0" cy="0" r="5.5" fill="#10B981" />
      <path d="M-2.5,0 L-0.5,2 L 2.5,-2.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- LÁPIZ PREMIUM (Escribiendo la palabra o completándola) -->
  <!-- Corregido: la punta (mina) es el pivote (0,0) y se dibuja horizontal a la derecha, 
       luego se rota e inclina para apuntar hacia abajo y a la izquierda, 
       evitando cortes en el borde superior y apuntando correctamente al renglón. -->
  <g transform="translate(58, 38) rotate(-35)" filter="url(#shadow-3d)">
    <!-- 1. Punta de grafito (Mina activa que escribe en 0,0) -->
    <path d="M 0,0 L 4,-2 L 4,2 Z" fill="#374151" stroke="#78350F" stroke-width="0.8" />
    
    <!-- 2. Madera expuesta sacada con sacapuntas -->
    <path d="M 4,-2 L 10,-4 L 10,4 L 4,2 Z" fill="#FDE047" stroke="#78350F" stroke-width="0.8" />
    
    <!-- 3. Cuerpo del lápiz (Amarillo/Dorado) -->
    <path d="M 10,-4 L 30,-4 L 30,4 L 10,4 Z" fill="url(#pencilGrad)" stroke="#78350F" stroke-width="0.8" />
    
    <!-- 4. Casquillo metálico -->
    <path d="M 30,-4 L 34,-4 L 34,4 L 30,4 Z" fill="#94A3B8" stroke="#78350F" stroke-width="0.8" />
    
    <!-- 5. Borrador de goma rosa -->
    <path d="M 34,-4 L 39,-4 L 39,4 L 34,4 Z" fill="#F472B6" stroke="#78350F" stroke-width="0.8" />
  </g>
</svg>
