<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFFAFE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
    <!-- Gradiente de los sentidos (Ojo principal) -->
    <linearGradient id="senseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Símbolo de los sentidos: Ojo iluminado y ondas sonoras -->
  <g transform="translate(32, 32)" filter="drop-shadow(0px 3px 2px rgba(14, 116, 144, 0.2))">
    <!-- Contorno del ojo -->
    <path d="M -18,0 C -10,-12 10,-12 18,0 C 10,12 -10,12 -18,0 Z" fill="url(#senseGrad)" />
    <!-- Iris blanco -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <!-- Pupila cian -->
    <circle cx="0" cy="0" r="3.5" fill="#06B6D4" />
    <!-- Brillo del ojo -->
    <circle cx="2.5" cy="-2.5" r="1.2" fill="#FFFFFF" />
    
    <!-- Ceja estilizada arriba -->
    <path d="M -15,-10 C -5,-16 5,-16 15,-10" fill="none" stroke="#0E7490" stroke-width="2" stroke-linecap="round" />

    <!-- Ondas decorativas alrededor (Símbolo de audición/percepción) -->
    <path d="M -22,-6 C -25,-3 -25,3 -22,6" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 22,-6 C 25,-3 25,3 22,6" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
