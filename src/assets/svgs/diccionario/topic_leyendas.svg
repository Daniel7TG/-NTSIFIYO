<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo nocturno profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <!-- Gradiente dorado de la luna -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Estrellas titilantes de fondo -->
  <circle cx="16" cy="22" r="0.8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="48" cy="18" r="1.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="44" cy="36" r="0.8" fill="#FFFFFF" opacity="0.6" />
  <path d="M 48,15 L 48,21 M 45,18 L 51,18" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8" />

  <!-- Luna creciente brillante -->
  <g transform="translate(24, 18)" filter="drop-shadow(0px 0px 4px rgba(253, 224, 71, 0.4))">
    <path d="M 0,0 C 12,0 16,10 16,20 C 16,30 10,34 0,34 C 8,34 11,26 11,17 C 11,8 6,0 0,0 Z" fill="url(#moonGrad)" />
  </g>

  <!-- Silueta de un lobo/coyote aullándole a la luna en una montaña -->
  <g transform="translate(18, 32)" filter="drop-shadow(0px 3px 2px rgba(15, 23, 42, 0.5))">
    <!-- Montaña/roca -->
    <path d="M -8,18 L 8,6 L 22,18 Z" fill="#0F172A" />
    <path d="M 2,12 L 20,4 L 32,18 Z" fill="#1E293B" />
    
    <!-- Lobo/Coyote aullando -->
    <path d="M 8,6 
             C 8,6 6,3 5,1 
             C 4,-1 2,-3 1,-3 
             C 0,-3 -1,-1 0,1 
             C 1,3 4,4 5,6 
             L 5,8 
             C 3,8 2,10 3,12 
             L 10,12 
             L 10,8 Z" 
          fill="#0F172A" 
          transform="translate(0, -2) scale(1.3)" />
  </g>
</svg>
