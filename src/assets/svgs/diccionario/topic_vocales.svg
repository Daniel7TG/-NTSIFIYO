<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <!-- Gradientes de las letras -->
    <linearGradient id="letterGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="letterGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Letras Vocales flotantes tridimensionales (A, E, I) -->
  <g transform="translate(32, 32)" filter="drop-shadow(0px 3px 2.5px rgba(29, 78, 216, 0.25))">
    <!-- Vocal 'A' (Izquierda, más grande) -->
    <g transform="translate(-10, -3) rotate(-10)">
      <rect x="-10" y="-12" width="20" height="24" rx="4" fill="url(#letterGrad1)" stroke="#60A5FA" stroke-width="1" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    </g>

    <!-- Vocal 'E' (Derecha/Arriba, mediana) -->
    <g transform="translate(11, -8) rotate(12)">
      <rect x="-8" y="-9" width="16" height="18" rx="3.5" fill="url(#letterGrad2)" stroke="#93C5FD" stroke-width="0.8" />
      <text x="0" y="5.5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">E</text>
    </g>

    <!-- Vocal 'I' (Abajo/Centro, delgada/larga) -->
    <g transform="translate(4, 12) rotate(-5)">
      <rect x="-6" y="-7" width="12" height="14" rx="3" fill="#1D4ED8" stroke="#3B82F6" stroke-width="0.8" />
      <text x="0" y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">I</text>
    </g>
  </g>
</svg>
