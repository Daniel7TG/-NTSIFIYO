<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo (Estilo pergamino suave) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <!-- Gradiente del pergamino -->
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF4E3" />
    </linearGradient>
    <!-- Gradiente de la pluma (Fénix/Pájaro en tonos bronce/dorados) -->
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Pergamino enrollado con pluma de escribir (Poemas) -->
  <g transform="translate(30, 32)" filter="drop-shadow(0px 3px 2px rgba(146, 64, 14, 0.2))">
    <!-- Pergamino enrollado de fondo -->
    <path d="M -16,-16 
             L 10,-16 
             C 14,-16 16,-12 16,-8 
             L 16,12 
             C 16,16 12,18 8,18 
             L -18,18 
             C -22,18 -24,14 -24,10 
             L -24,-10 
             C -24,-14 -20,-16 -16,-16 Z" 
          fill="url(#scrollGrad)" stroke="#F59E0B" stroke-width="1" />
          
    <!-- Rollito superior del pergamino -->
    <path d="M -16,-16 C -12,-16 -10,-14 -12,-11 C -14,-8 -18,-8 -20,-11 C -22,-14 -20,-16 -16,-16 Z" fill="#F59E0B" opacity="0.6" />
    <!-- Rollito inferior del pergamino -->
    <path d="M 8,18 C 12,18 14,16 12,13 C 10,10 6,10 4,13 C 2,16 4,18 8,18 Z" fill="#F59E0B" opacity="0.6" />

    <!-- Líneas de poema/escritura cursiva simulas -->
    <path d="M -14,-8 C -10,-8 -10,-10 -6,-10 M -12,-4 C -8,-4 -8,-6 -4,-6 M -14,0 C -10,0 -10,-2 -6,-2 M -12,4 C -8,4 -8,2 -4,2" fill="none" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Pluma de escribir (Quill Pen) cruzada -->
    <g transform="translate(10, 0) rotate(-35)">
      <!-- Punta de la pluma -->
      <path d="M -12,15 L -9,11 L -7,12 Z" fill="#78350F" />
      
      <!-- Eje central de la pluma (Calamus) -->
      <path d="M -9,11 L 12,-18" fill="none" stroke="#92400E" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Cerdas/Pluma estilizada (Vanes) -->
      <path d="M -7,10 
               C -1,6 4,-1 11,-12 
               C 12,-14 9,-16 8,-16 
               C 1,-8 -5,-2 -9,7" 
            fill="url(#quillGrad)" />
            
      <!-- Detalles de cortes en las cerdas de la pluma -->
      <path d="M 4,-2 L 7,-3 M 0,3 L 3,2" stroke="#FEF3C7" stroke-width="1" />
    </g>
  </g>
</svg>
