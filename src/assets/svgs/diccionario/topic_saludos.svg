<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <!-- Gradientes de globos de diálogo (Greetings) -->
    <linearGradient id="chatGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="chatGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Globos de conversación de Saludos -->
  <g transform="translate(32, 32)" filter="drop-shadow(0px 3px 2px rgba(20, 83, 45, 0.15))">
    <!-- Globo Izquierdo (Emisor) -->
    <g transform="translate(-10, -8)">
      <rect x="-14" y="-10" width="28" height="18" rx="6" fill="url(#chatGradLeft)" />
      <path d="M -4,8 L -10,14 L -8,8 Z" fill="#14532D" />
      <!-- Líneas de diálogo blancas -->
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#F0FDF4" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <line x1="-8" y1="1" x2="2" y2="1" stroke="#F0FDF4" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- Globo Derecho (Respuesta) -->
    <g transform="translate(12, 6)">
      <rect x="-13" y="-9" width="26" height="16" rx="5" fill="url(#chatGradRight)" />
      <path d="M 4,7 L 9,12 L 7,7 Z" fill="#15803D" />
      <!-- Líneas de diálogo verdes claro -->
      <line x1="-7" y1="-3" x2="7" y2="-3" stroke="#F0FDF4" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
      <line x1="-7" y1="2" x2="1" y2="2" stroke="#F0FDF4" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>
