<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="grad-18" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff26c8" />
      <stop offset="55%" stop-color="#ea171d" />
      <stop offset="100%" stop-color="#b28808" />
    </radialGradient>
    <filter id="shadow-18" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f0f23" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow-18)">
